name: EcoTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Backend Test & Lint (Python 3.11)
  # ==========================================
  ai-service-test:
    name: AI Service Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 httpx

      - name: Lint syntax with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Additional warnings check with exit-zero (does not fail build for style)
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Smoke & Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  # ==========================================
  # JOB 2: Express Backend Test (Node.js 20)
  # ==========================================
  backend-test:
    name: Express Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Generate Prisma
        run: |
          npm install
          npx prisma generate

      - name: Run Vitest Unit Tests
        run: npm test

  # ==========================================
  # JOB 3: Frontend Build (React + Vite)
  # ==========================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

  # ==========================================
  # JOB 4: Docker Compose Validation
  # ==========================================
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose syntax
        run: docker compose config

      - name: Build Docker images
        run: docker compose build
