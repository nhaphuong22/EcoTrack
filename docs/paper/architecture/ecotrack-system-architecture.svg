<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EcoTrack System Architecture</title>
  <desc id="desc">Data ingestion, AI services, FastAPI, React dashboard, and operator feedback flow.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#11243e"/></linearGradient>
    <linearGradient id="green" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="blue" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7dd3fc"/></marker>
    <style>
      .title{font:700 38px 'Segoe UI',sans-serif;fill:#f8fafc}.sub{font:18px 'Segoe UI',sans-serif;fill:#94a3b8}
      .h{font:700 22px 'Segoe UI',sans-serif;fill:#fff}.t{font:16px 'Segoe UI',sans-serif;fill:#dbeafe}.tiny{font:14px 'Segoe UI',sans-serif;fill:#94a3b8}
      .box{rx:20;filter:url(#shadow);stroke-width:2}.edge{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="65" text-anchor="middle" class="title">EcoTrack — Kiến trúc hệ thống quản lý năng lượng thông minh</text>
  <text x="800" y="98" text-anchor="middle" class="sub">Dự báo phụ tải · Phát hiện bất thường · Copilot chẩn đoán</text>

  <rect x="70" y="180" width="300" height="470" class="box" fill="#10243a" stroke="#334155"/>
  <text x="220" y="225" text-anchor="middle" class="h">Tầng dữ liệu</text>
  <rect x="105" y="270" width="230" height="100" rx="14" fill="#19324c"/><text x="220" y="312" text-anchor="middle" class="t">Đồng hồ điện / BMS</text><text x="220" y="340" text-anchor="middle" class="tiny">Telemetry theo giờ</text>
  <rect x="105" y="405" width="230" height="100" rx="14" fill="#19324c"/><text x="220" y="447" text-anchor="middle" class="t">Building Data Genome 2</text><text x="220" y="475" text-anchor="middle" class="tiny">Dữ liệu lịch sử + thời tiết</text>
  <rect x="105" y="540" width="230" height="75" rx="14" fill="#19324c"/><text x="220" y="585" text-anchor="middle" class="t">Feature Engineering</text>

  <rect x="480" y="150" width="470" height="550" class="box" fill="#10243a" stroke="#10b981"/>
  <text x="715" y="195" text-anchor="middle" class="h">Tầng AI &amp; phân tích</text>
  <rect x="520" y="240" width="390" height="105" rx="16" fill="url(#green)"/><text x="715" y="283" text-anchor="middle" class="h">XGBoost Forecaster</text><text x="715" y="315" text-anchor="middle" class="t">Dự báo + khoảng tin cậy 95%</text>
  <rect x="520" y="385" width="390" height="105" rx="16" fill="#be123c"/><text x="715" y="428" text-anchor="middle" class="h">Isolation Forest</text><text x="715" y="460" text-anchor="middle" class="t">Điểm bất thường + mức nghiêm trọng</text>
  <rect x="520" y="530" width="390" height="125" rx="16" fill="url(#blue)"/><text x="715" y="575" text-anchor="middle" class="h">EcoTrack Copilot</text><text x="715" y="607" text-anchor="middle" class="t">RCA · khuyến nghị · ước tính lãng phí</text><text x="715" y="632" text-anchor="middle" class="tiny" fill="#dbeafe">Grounded bằng dữ liệu sự cố</text>

  <rect x="1060" y="180" width="470" height="470" class="box" fill="#10243a" stroke="#38bdf8"/>
  <text x="1295" y="225" text-anchor="middle" class="h">Tầng ứng dụng</text>
  <rect x="1100" y="270" width="390" height="95" rx="16" fill="#1d4ed8"/><text x="1295" y="310" text-anchor="middle" class="h">FastAPI REST API</text><text x="1295" y="338" text-anchor="middle" class="tiny" fill="#dbeafe">Energy · Forecast · Anomaly · Copilot</text>
  <rect x="1100" y="405" width="390" height="105" rx="16" fill="#0f766e"/><text x="1295" y="448" text-anchor="middle" class="h">React Dashboard</text><text x="1295" y="480" text-anchor="middle" class="t">Recharts · Anomaly Table · KPI</text>
  <rect x="1100" y="550" width="390" height="65" rx="16" fill="#6d28d9"/><text x="1295" y="590" text-anchor="middle" class="h">Copilot Drawer</text>

  <path class="edge" d="M370 420H480"/><text x="425" y="404" text-anchor="middle" class="tiny">features</text>
  <path class="edge" d="M950 310H1060"/><text x="1005" y="294" text-anchor="middle" class="tiny">JSON</text>
  <path class="edge" d="M1060 465H950"/><text x="1005" y="449" text-anchor="middle" class="tiny">query</text>
  <path class="edge" d="M1295 365V405"/>
  <path class="edge" d="M1295 510V550"/>
  <path class="edge" d="M1100 582C1010 582 1010 595 950 595"/><text x="1015" y="565" text-anchor="middle" class="tiny">context sự cố</text>

  <rect x="330" y="775" width="940" height="72" rx="36" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="800" y="806" text-anchor="middle" class="t">Vòng phản hồi vận hành</text>
  <text x="800" y="831" text-anchor="middle" class="tiny">Kỹ sư xác nhận sự cố → hành động khắc phục → dữ liệu mới → cải thiện mô hình</text>
</svg>
